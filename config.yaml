# Central configuration for the whole pipeline.
# Every script reads this file, so an experiment is fully described by it.

seed: 42

paths:
  raw_dir: data/raw               # downloaded archive + extracted images
  image_dir: data/raw/flower_photos
  clean_dir: data/processed       # manifests produced by the cleaning step
  splits_dir: data/splits         # train/val/test CSV manifests
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

dataset:
  name: TensorFlow Flowers (flower_photos)
  url: https://storage.googleapis.com/download.tensorflow.org/example_images/flower_photos.tgz
  licence: CC BY 2.0 (per-image attribution in LICENSE.txt)
  archive: flower_photos.tgz
  min_side: 64                    # images smaller than this on either side are discarded

split:
  train: 0.70
  val: 0.15
  test: 0.15

image:
  size: 224                       # native resolution for ImageNet-pretrained backbones
  resize_short: 256               # eval: resize short side then centre-crop to `size`
  mean: [0.485, 0.456, 0.406]     # ImageNet statistics, required by the pretrained weights
  std: [0.229, 0.224, 0.225]

train:
  arch: mobilenet_v2              # mobilenet_v2 | efficientnet_b0 | custom_cnn
  batch_size: 32
  num_workers: 2
  label_smoothing: 0.0
  class_weighting: true           # inverse-frequency weights in the loss
  dropout: 0.3
  # Stage 1: frozen backbone, train the classification head only
  head_epochs: 8
  head_lr: 1.0e-3
  # Stage 2: unfreeze the upper backbone blocks and fine-tune at a lower LR
  finetune_epochs: 15
  finetune_lr: 1.0e-4
  unfreeze_fraction: 0.3          # fraction of backbone feature blocks to unfreeze
  weight_decay: 1.0e-4
  early_stopping_patience: 4      # monitored on validation loss
  # Custom CNN (trained from scratch, single stage)
  scratch_epochs: 30
  scratch_lr: 1.0e-3

inference:
  uncertain_threshold: 0.60       # below this top-1 confidence the app answers "uncertain"
  top_k: 3
